---
version: "1.0"
response_200.yaml:
  condition: "$zosAssetResponse.commarea.\"VRCB10-COMMAREA\".\"VRCB10-OPERATION-RESULT\".\"VRCB10-RETURN-CODE\" = 0"
  httpStatusCode: 200
response_400.yaml:
  condition: "$zosAssetResponse.commarea.\"VRCB10-COMMAREA\".\"VRCB10-OPERATION-RESULT\".\"VRCB10-ERROR-CODE\" = 'VR-CUST-004'"
  httpStatusCode: 400
response_404.yaml:
  condition: "$zosAssetResponse.commarea.\"VRCB10-COMMAREA\".\"VRCB10-OPERATION-RESULT\".\"VRCB10-ERROR-CODE\" = 'VR-CUST-005'"
  httpStatusCode: 404
response_500.yaml:
  condition: true
  httpStatusCode: 500
